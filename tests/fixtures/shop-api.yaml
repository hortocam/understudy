  "components": {
    "schemas": {
      "Venue": {
        "title": "Venue",
        "type": "object",
        "required": [
          "id",
          "name"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string",
            "minLength": 3,
            "maxLength": 40
          },
          "city": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "MA",
              "NY",
              "CA"
            ]
          },
          "timezone": {
            "type": "string"
          }
        }
      },
      "Event": {
