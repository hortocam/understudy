            "type": "integer"
          },
          "name": {
            "type": "string",
            "minLength": 3
          },
          "venueId": {
            "type": "integer"
          },
          "category": {
            "type": "string",
            "enum": [
              "music",
              "sport",
              "theatre"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "contactEmail": {
