openapi: 3.1.0
info:
  title: Reserved Table API
  version: 1.0.0
  description: >
    Fixture for the tool-table-name collision (FU: a resource named exactly `_requests` or
    `_understudy_meta`). The representation schema's `title` is `_requests`, which is the name
    of one of the tool's own tables, so the derived resource's table would collide with it.
    `/notes` is a positive control: a normal resource that must keep starting.
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReservedWidget" }
    post:
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservedWidgetCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedWidget" }
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedWidget" }
  /notes:
    get:
      operationId: listNotes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
  /notes/{id}:
    get:
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
components:
  schemas:
    ReservedWidget:
      title: _requests
      type: object
      required: [id, kind]
      properties:
        id: { type: integer }
        kind: { type: string }
    ReservedWidgetCreate:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string }
    Note:
      type: object
      required: [id, text]
      properties:
        id: { type: integer }
        text: { type: string }
    NoteCreate:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
