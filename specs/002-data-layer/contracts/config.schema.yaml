{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://understudy.dev/schemas/config.schema.json",
  "title": "understudy project configuration",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "spec",
    "operations"
  ],
  "properties": {
    "spec": {
      "type": "string",
      "description": "Path or URL of the OpenAPI 3.0/3.1 document. A URL is the only outbound network call the tool ever makes.",
      "examples": [
        "./specs/pos-api.yaml",
        "https://example.test/openapi.json"
      ]
    },
    "operations": {
      "type": "array",
      "minItems": 1,
      "description": "The operations to make live. Everything else answers 501. Empty or unknown entries refuse to start. An operation may be named by 'METHOD /path', by operationId, or by tag (a tag containing a space is written with '_').",
      "items": {
        "type": "string",
        "minLength": 1,
        "description": "Either 'METHOD /path', an operationId, or a tag name. All three are peers with no precedence: a document may support only one of them (the measured target has 0 operationIds, so tag selectors are the ergonomic answer there), so none is a fallback. An operationId is NOT constrained to an identifier shape — OpenAPI only requires it to be a unique string, and real documents use hyphens and dots (e.g. 'get-widgets', 'api.getWidgets'); a tag containing a space is written with '_' ('Market Orders' -> 'Market_Orders'), with the raw form also accepted and an ambiguous collapse refused by name. A genuinely unknown entry is refused at startup by name, not by this pattern.",
        "examples": [
          "POST /inventory",
          "getInventoryById",
          "Inventory",
          "Market_Orders"
        ]
      }
    },
    "paths": {
      "type": "object",
      "additionalProperties": false,
      "description": "The four configuration layers (FR-001). Each folder is loadable without the others; a missing folder is not an error.",
      "properties": {
        "static": {
          "type": "string",
          "default": "./static",
          "description": "Versioned fixtures: 'lookups/' (small named tables) and 'entities/' (fixed records with fixed identities). Applied identically every run and never mutated by generation, import or API activity (FR-002, principle IV)."
        },
        "imports": {
          "type": "string",
          "default": "./imports",
          "description": "Import mappings and their data. Shape defined and validated in this slice; read in slice 3."
        },
        "dynamic": {
          "type": "string",
          "default": "./dynamic",
          "description": "Generation recipes — the switchable datasets. One file per recipe, selected by name (recipe:) or at start (--recipe)."
        },
        "behavior": {
          "type": "string",
          "default": "./behavior",
          "description": "Targets, subscriptions, actions, reactions, simulations. Parsed and validated in this slice; acted on in slices 4-5."
        }
      }
    },
    "recipe": {
      "type": "string",
      "description": "Name of the recipe (a file under paths.dynamic, without extension) to apply. Overridable at start with --recipe. Absent means 'no generation': only fixtures are loaded.",
      "examples": [
        "ci-small",
        "load-test"
      ]
    },
    "seed": {
      "type": "integer",
      "default": 0,
      "description": "Default global seed; when absent it is 0 (there is no hidden entropy — the same spec, config and fixtures always produce the same data). A recipe may override it, and `--seed` overrides both at start. The per-collection seed is derived from the global seed and the collection name, so adding an unrelated collection changes no existing collection's records (FR-016).",
      "examples": [
        42
      ]
    },
    "entities": {
      "type": "object",
      "description": "Per-collection overrides. Every key is optional: an unlisted collection is generated with inferred links and the default precedence chain.",
      "additionalProperties": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "idField": {
            "type": "string",
            "description": "The identity property. Defaults to the derived identity field."
          },
          "writes": {
            "type": "string",
            "enum": [
              "api",
              "actions-only"
            ],
            "default": "api",
            "description": "'actions-only' refuses API writes for this collection even if the document declares them (used from slice 5)."
          },
          "ids": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "generatedStart": {
                "type": "integer",
                "description": "First generated identity, for an integer identity space. Reserved: it must not overlap fixture identities.",
                "examples": [
                  500000
                ]
              },
              "reserved": {
                "type": "string",
                "description": "An explicit reserved span for a non-integer identity space, written '<from>..<to>' inclusive: for a prefixed/formatted string the declared pattern's numeric run ('EVT-100000..EVT-199999'); for a uuid a leading-hex span ('a0000000..afffffff'). Overlapping configured spans, or fixture identities inside the span, refuse to start naming the collection (FR-017, SC-006).",
                "examples": [
                  "EVT-100000..EVT-199999"
                ]
              }
            }
          },
          "relations": {
            "type": "object",
            "description": "Explicit links, pinned by configuration. These take precedence over every inferred link (evidence order, FR-006).",
            "additionalProperties": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "to"
              ],
              "properties": {
                "to": {
                  "type": "string",
                  "description": "Target as '<Collection>.<field>', e.g. 'Event.id'.",
                  "pattern": "^[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$"
                },
                "onDelete": {
                  "type": "string",
                  "enum": [
                    "restrict",
                    "cascade",
                    "setNull"
                  ],
                  "default": "restrict",
                  "description": "The delete policy for the generated foreign key. Arrives in this slice, where relationships first become concrete. An undetermined (reported, not decided) link gets no constraint."
                }
              }
            }
          }
        }
      }
    },
    "server": {
      "type": "object",
      "additionalProperties": false,
      "description": "The mocked surface.",
      "properties": {
        "port": {
          "type": "integer",
          "minimum": 0,
          "maximum": 65535,
          "default": 8080
        },
        "host": {
          "type": "string",
          "default": "127.0.0.1"
        },
        "basePath": {
          "type": "string",
          "default": ""
        }
      }
    },
    "control": {
      "type": "object",
      "additionalProperties": false,
      "description": "The control surface. Must not be reachable from the mocked surface's routes.",
      "properties": {
        "prefix": {
          "type": "string",
          "pattern": "^/",
          "default": "/__understudy",
          "description": "Reserved prefix. A request here is never routed into the mocked surface. Composed as prefix + path, so it carries no trailing slash."
        },
        "port": {
          "type": "integer",
          "minimum": 0,
          "maximum": 65535,
          "description": "Omit to serve the control API on the same instance as the mock, under the prefix."
        },
        "host": {
          "type": "string"
        }
      }
    },
    "storage": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "driver": {
          "type": "string",
          "enum": [
            "sqlite",
            "postgres"
          ],
          "default": "sqlite",
          "description": "Reserved for a later slice: only 'sqlite' is implemented. 'postgres' is accepted by the schema so the shape is stable before the feature lands; selecting it refuses to start with a clear message until the adapter exists."
        },
        "path": {
          "type": "string",
          "default": "./.understudy/state.db",
          "description": "SQLite file. Its directory is created if absent; an unwritable path refuses to start."
        }
      }
    },
    "ids": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "generatedStart": {
          "type": "integer",
          "default": 100000,
          "description": "First identity for records created over the API. Reserved range: it must not overlap identities that fixtures declare."
        }
      }
    },
    "signing": {
      "type": "object",
      "additionalProperties": false,
      "description": "RESERVED — accepted by the schema so the shape is stable, but not read in this slice, and selecting it is a STARTUP REFUSAL naming the key (it is never a silent no-op: a config key that quietly does nothing is worse than one that does not exist). Webhook HMAC signing lands with the webhook slices; algorithm, header name and signed-content template will all be configurable.",
      "properties": {
        "alg": {
          "type": "string",
          "default": "hmac-sha256"
        },
        "header": {
          "type": "string",
          "default": "X-Signature"
        }
      }
    },
    "clock": {
      "type": "object",
      "additionalProperties": false,
      "description": "The clock seam. 'real' is implemented and is the default; 'virtual' is RESERVED for slice 6, and selecting it refuses to start naming the mode. Every time-derived field is governed by this clock so exports are comparable, and the startup report states the mode in force (FR-019).",
      "properties": {
        "mode": {
          "type": "string",
          "enum": [
            "real",
            "virtual"
          ],
          "default": "real"
        },
        "start": {
          "type": "string",
          "format": "date-time",
          "description": "The instant the real clock reports and the reference date pinned for every time-relative generated value, so a seeded run is reproducible (research §1)."
        }
      }
    },
    "inference": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "idSuffixes": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "default": [
            "Id",
            "_id"
          ],
          "description": "Property-name suffixes that propose a link to the collection named by the rest of the name ('eventId' proposes Event). A proposal is decided only when unambiguous (FR-006)."
        },
        "ambiguousNames": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "default": [
            "externalId",
            "referenceId",
            "refId",
            "parentId"
          ],
          "description": "Property names that denote a different entity per collection (the measured 'externalId' occurs 45 times, each meaning a different external system). They are never decided by convention: each is reported as an undetermined link and pinned with entities.<X>.relations."
        }
      },
      "description": "The naming-convention rules of link inference (evidence rung 3). Both keys are optional; the defaults are shown.",
      "examples": [
        {
          "idSuffixes": [
            "Id"
          ],
          "ambiguousNames": [
            "externalId"
          ]
        }
      ]
    }
  },
  "$defs": {
    "FixtureFile": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "entity": {
          "type": "string",
          "description": "The collection (a derived resource) or lookup-table name the rows belong to. A collection is stored with origin 'static'; a name that is not a collection is an in-memory lookup table (reported as 'lookup-only'). Anything else refuses to start."
        },
        "idField": {
          "type": "string",
          "description": "The identity property of the rows. Defaults to the collection's derived identity field, else 'id'."
        },
        "rows": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object"
          },
          "description": "Fixed rows. Each declares its own identity and is applied identically on every run; generation, import and runtime allocation never reuse these identities (FR-002, FR-017)."
        }
      },
      "required": [
        "entity",
        "rows"
      ]
    },
    "LookupFile": {
      "$ref": "#/$defs/FixtureFile",
      "description": "static/lookups/*.yaml — a small named table of codes (FR-001). A recipe field rule 'lookup: <entity>' draws a row of it.",
      "examples": [
        {
          "entity": "InventoryStatus",
          "idField": "id",
          "rows": [
            {
              "id": 1,
              "code": "available"
            },
            {
              "id": 2,
              "code": "held"
            }
          ]
        }
      ]
    },
    "EntitiesFile": {
      "$ref": "#/$defs/FixtureFile",
      "description": "static/entities/*.yaml — fixed records with fixed identities (FR-001).",
      "examples": [
        {
          "entity": "Venue",
          "rows": [
            {
              "id": 1,
              "name": "Test Arena"
            }
          ]
        }
      ]
    },
    "FieldRule": {
      "description": "One instruction for one field (FR-011). Exactly one rule kind per field. Precedence level 1 of FR-010 (faker rules are the heuristic, level 5, but an explicit 'faker:' rule is still an explicit rule and wins).",
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "generator": {
              "type": "string",
              "description": "A named generator: a built-in (choice/sequence-like names) or a custom one declared under the recipe's 'generators' (FR-012). One namespace."
            }
          },
          "required": [
            "generator"
          ]
        },
        {
          "type": "object",
          "additionalProperties": true,
          "properties": {
            "faker": {
              "type": "string",
              "description": "A path into @faker-js/faker, e.g. 'string.alpha' or 'finance.amount'. Remaining keys are that method's options (length, casing, min, max, dec, ...)."
            }
          },
          "required": [
            "faker"
          ],
          "not": {
            "anyOf": [
              {
                "required": [
                  "generator"
                ]
              },
              {
                "required": [
                  "lookup"
                ]
              },
              {
                "required": [
                  "ref"
                ]
              },
              {
                "required": [
                  "seq"
                ]
              },
              {
                "required": [
                  "choice"
                ]
              },
              {
                "required": [
                  "expr"
                ]
              }
            ]
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "lookup": {
              "type": "string",
              "description": "A lookup table (fixture entity) name."
            },
            "weights": {
              "type": "object",
              "additionalProperties": {
                "type": "number",
                "minimum": 0
              },
              "description": "Weight by row key (the row's 'by' field); omitted means uniform."
            },
            "by": {
              "type": "string",
              "description": "The row field the weights are keyed by. Default 'code', else the row's identity."
            },
            "value": {
              "type": "string",
              "description": "The row field the draw yields. Default: the row's identity, so the stored value references a real row."
            }
          },
          "required": [
            "lookup"
          ]
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "ref": {
              "type": "string",
              "pattern": "^[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$",
              "description": "'<Collection>.<field>' — the value of an existing record of another collection (usually its identity)."
            }
          },
          "required": [
            "ref"
          ]
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "seq": {
              "type": "string",
              "description": "A named sequence, monotonic and independent per collection."
            },
            "start": {
              "type": "integer",
              "default": 1
            },
            "step": {
              "type": "integer",
              "default": 1
            }
          },
          "required": [
            "seq"
          ]
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "choice": {
              "type": "array",
              "minItems": 1,
              "description": "A value drawn from this explicit set."
            },
            "weights": {
              "type": "array",
              "items": {
                "type": "number",
                "minimum": 0
              }
            }
          },
          "required": [
            "choice"
          ]
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "expr": {
              "type": "string",
              "description": "A JSONata calculation over the record's own sibling fields, evaluated after the fields it names. Seeded helpers are available: $uniform(min,max), $choice(array), $int(min,max)."
            }
          },
          "required": [
            "expr"
          ]
        }
      ],
      "examples": [
        {
          "faker": "string.alpha",
          "length": 1,
          "casing": "upper"
        },
        {
          "expr": "cost * $uniform(1.1, 2.5)"
        },
        {
          "lookup": "InventoryStatus",
          "weights": {
            "available": 0.8,
            "held": 0.2
          }
        },
        {
          "ref": "Event.id"
        },
        {
          "choice": [
            "GA",
            "FLOOR"
          ]
        }
      ]
    },
    "GeneratorDef": {
      "description": "A custom named generator (FR-012), used in a field rule exactly like a built-in: 'generator: <name>'. Defined inline, or by a plugin file whose default export is (ctx) => value and which receives only the collection's seeded random stream.",
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "choice": {
              "type": "array",
              "minItems": 1
            },
            "weights": {
              "type": "array",
              "items": {
                "type": "number",
                "minimum": 0
              }
            }
          },
          "required": [
            "choice"
          ]
        },
        {
          "type": "object",
          "additionalProperties": true,
          "properties": {
            "faker": {
              "type": "string"
            }
          },
          "required": [
            "faker"
          ],
          "not": {
            "anyOf": [
              {
                "required": [
                  "generator"
                ]
              },
              {
                "required": [
                  "lookup"
                ]
              },
              {
                "required": [
                  "ref"
                ]
              },
              {
                "required": [
                  "seq"
                ]
              },
              {
                "required": [
                  "choice"
                ]
              },
              {
                "required": [
                  "expr"
                ]
              }
            ]
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "seq": {
              "type": "string"
            },
            "start": {
              "type": "integer",
              "default": 1
            },
            "step": {
              "type": "integer",
              "default": 1
            }
          },
          "required": [
            "seq"
          ]
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "plugin"
          ],
          "properties": {
            "plugin": {
              "type": "string",
              "description": "Path of an ES module (relative to the recipe file) whose default export is a function (ctx) => value; ctx.rng is the collection's seeded stream. Plugins are local files: the tool opens no network connection to load one."
            }
          }
        }
      ],
      "examples": [
        {
          "choice": [
            "100",
            "101",
            "FLOOR",
            "GA"
          ]
        }
      ]
    },
    "RecipeEntity": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "source": {
          "const": "import",
          "description": "Reserved for slice 3: this collection's records come from an import mapping and generation skips it (reported, never silent)."
        },
        "count": {
          "type": "integer",
          "minimum": 0,
          "description": "An absolute number of records to generate."
        },
        "perParent": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "entity": {
              "type": "string",
              "description": "The parent collection."
            },
            "range": {
              "type": "array",
              "items": {
                "type": "integer",
                "minimum": 0
              },
              "minItems": 2,
              "maxItems": 2,
              "description": "[min, max] children per parent, inclusive."
            },
            "distribution": {
              "type": "string",
              "enum": [
                "uniform",
                "zipf"
              ],
              "default": "uniform",
              "description": "The shape of per-parent counts over the range: 'uniform' or 'zipf' (mass concentrated toward the minimum)."
            }
          },
          "required": [
            "entity",
            "range"
          ],
          "description": "A count relative to a parent collection (FR-015). Every child references a real parent."
        },
        "fields": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/FieldRule"
          },
          "description": "Field rules; an unlisted field falls through the precedence chain (supplied value, the document's own constraints/examples/defaults, a plausible-value heuristic, the type default)."
        },
        "constraints": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "description": "Invariants (FR-013): JSONata boolean expressions over the generated record, e.g. 'price >= cost'. A violating draw is redrawn; past the budget the run fails naming the rule."
        },
        "redraws": {
          "type": "integer",
          "minimum": 0,
          "default": 50,
          "description": "The redraw budget per record for 'constraints' (FR-013)."
        }
      },
      "description": "One collection's generation recipe. A collection absent from the recipe is not generated (fixtures only). It must say how many: 'count' or 'perParent' (or 'source: import')."
    },
    "Recipe": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "seed": {
          "type": "integer",
          "description": "Overrides the global seed for this recipe."
        },
        "entities": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/RecipeEntity"
          }
        },
        "generators": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/GeneratorDef"
          }
        }
      },
      "description": "dynamic/<name>.yaml — a named, switchable generation recipe (FR-003).",
      "examples": [
        {
          "seed": 42,
          "entities": {
            "Event": {
              "source": "import"
            },
            "Inventory": {
              "perParent": {
                "entity": "Event",
                "range": [
                  10,
                  50
                ],
                "distribution": "zipf"
              },
              "fields": {
                "section": {
                  "generator": "sectionCode"
                },
                "row": {
                  "faker": "string.alpha",
                  "length": 1,
                  "casing": "upper"
                },
                "quantity": {
                  "faker": "number.int",
                  "min": 2,
                  "max": 8
                },
                "cost": {
                  "faker": "finance.amount",
                  "min": 20,
                  "max": 400,
                  "dec": 2
                },
                "price": {
                  "expr": "cost * $uniform(1.1, 2.5)"
                },
                "statusId": {
                  "lookup": "InventoryStatus",
                  "weights": {
                    "available": 0.8,
                    "held": 0.1,
                    "sold": 0.1
                  }
                }
              },
              "constraints": [
                "price >= cost"
              ]
            }
          },
          "generators": {
            "sectionCode": {
              "choice": [
                "100",
                "101",
                "102",
                "200",
                "201",
                "FLOOR",
                "GA"
              ]
            }
          }
        }
      ]
    },
    "ImportMapping": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "source": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "file": {
              "type": "string"
            },
            "format": {
              "type": "string",
              "enum": [
                "json",
                "csv",
                "yaml"
              ]
            }
          },
          "required": [
            "file",
            "format"
          ]
        },
        "select": {
          "type": "string",
          "description": "JSONPath, or a 'jsonata:'-prefixed expression."
        },
        "targets": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "entity": {
                "type": "string"
              },
              "upsertKey": {
                "type": "string"
              },
              "fields": {
                "type": "object",
                "additionalProperties": {
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "lookup": {
                          "type": "string"
                        },
                        "by": {
                          "type": "string"
                        },
                        "from": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "lookup",
                        "from"
                      ]
                    }
                  ]
                }
              }
            },
            "required": [
              "entity",
              "fields"
